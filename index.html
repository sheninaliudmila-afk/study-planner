<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мой учебный планировщик</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">◈ <span>Учебный планировщик</span></div><nav id="nav" aria-label="Разделы"></nav><p class="storage-note">Данные хранятся только в этом браузере.</p></aside><div class="workspace"><header class="top"><button id="menuToggle" class="mobile-menu" aria-label="Открыть меню">☰</button><h1 id="pageTitle">Обучение</h1><div class="top-actions"><span id="timerIndicator" aria-label="Таймер"></span><span id="saveStatus" role="status">Сохранено</span><button id="addGlobal" class="primary">+ Добавить</button></div></header><div id="notice" role="status" aria-live="polite"></div><div id="reminders" role="status" aria-live="polite"></div><div id="timerPanel"></div><main id="main"></main></div></div><div id="scrim" class="scrim" hidden></div><aside id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden><div class="editor-head"><h2 id="editorTitle"></h2><button id="closeEditor" aria-label="Закрыть">✕</button></div><form id="editorForm" novalidate><div id="editorFields"></div><div id="editorErrors" role="alert"></div><div class="editor-foot"><button type="button" id="cancelEditor">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></aside><dialog id="confirmDialog"><h2 id="confirmTitle">Подтверждение</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel">Отмена</button><button class="danger" id="confirmYes">Подтвердить</button></div></dialog><input type="file" id="importFile" accept=".json,application/json" hidden><script src="script.js" defer></script></body></html>
